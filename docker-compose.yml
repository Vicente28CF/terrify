services:
  # ─── Base de datos ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: terrify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: terrify_db
      POSTGRES_USER: terrify_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terrify_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrify_user -d terrify_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Caché / Rate limiting ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: terrify_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Django ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrify_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --workers 4 --threads 2 --timeout 30 --bind 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  # ─── Celery Worker (tareas asíncronas) ────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrify_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "celery -A config worker -l info --concurrency=4"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  # ─── Frontend Next.js ─────────────────────────────────────────
  frontend:
    profiles:
      - frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrify_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
